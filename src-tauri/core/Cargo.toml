[package]
name = "session-dock-core"
version = "0.2.0"
description = "SessionDock 核心：9 平台会话扫描、元数据与安全删除（无 GUI 依赖）"
authors = ["Yan"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rayon = "1.12.0"
chrono = "0.4.45"
regex = "1.13.2"
base64 = "0.23.1"
zstd = "0.13"
